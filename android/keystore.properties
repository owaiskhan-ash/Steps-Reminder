# Release signing for the sideloadable APK published on GitHub Releases.
#
# This keystore is committed on purpose so CI can produce reproducible, stable
# signing identities and so upgrades install over the previous release.
# It is NOT a Play Store key: treat it as public. For a real store release,
# replace these values with your own keystore (and keep that one private).
storeFile=keystore/sc-release.p12
storeType=PKCS12
storePassword=sc-step-reminder-2026
keyAlias=sc-release
keyPassword=sc-step-reminder-2026
